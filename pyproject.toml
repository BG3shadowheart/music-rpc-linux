[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-rpc-linux"
version = "1.0.0"
description = "Linux tray application for YouTube Music and MPRIS Discord Rich Presence"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["dbus-fast==5.2.0", "pypresence==4.6.2", "PySide6==6.11.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
